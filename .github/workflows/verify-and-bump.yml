name: Verify And Bump Hana SDK

on:
  repository_dispatch:
    types: [sdk-released]
  workflow_dispatch:
    inputs:
      version:
        description: "Target Hana SDK version (e.g. 1.0.6)"
        required: true
        type: string
      sector_id:
        description: "Sector ID used by TJVenusManager.initialize() during verification"
        required: false
        type: string
        default: "8"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verify-and-bump-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve-inputs:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      sector_id: ${{ steps.set.outputs.sector_id }}
    steps:
      - name: Resolve inputs
        id: set
        shell: bash
        run: |
          VERSION="${{ github.event.client_payload.version || inputs.version }}"
          SECTOR_ID="${{ github.event.client_payload.sector_id || inputs.sector_id || '8' }}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::version is required"
            exit 1
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sector_id=$SECTOR_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION sector_id=$SECTOR_ID"

  verify:
    needs: resolve-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Override TJHana-sdk-android dependency to release tag
        shell: bash
        run: |
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          sed -i -E "s|(com\.github\.tjlabs:TJHana-sdk-android:)[0-9]+\.[0-9]+\.[0-9]+|\1${VERSION}|" app/build.gradle.kts
          grep 'com.github.tjlabs:TJHana-sdk-android' app/build.gradle.kts

      - name: Run HanaAuthInitTest on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORG_GRADLE_PROJECT_AUTH_ACCESS_KEY: ${{ secrets.AUTH_ACCESS_KEY }}
          ORG_GRADLE_PROJECT_AUTH_SECRET_ACCESS_KEY: ${{ secrets.AUTH_SECRET_ACCESS_KEY }}
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.tjlabs.tjhana_demo_android.HanaAuthInitTest
            -Pandroid.testInstrumentationRunnerArguments.sectorId=${{ needs.resolve-inputs.outputs.sector_id }}
            --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-report
          path: app/build/reports/androidTests/connected/**
          if-no-files-found: ignore

  bump:
    needs: [resolve-inputs, verify]
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.commit.outputs.branch }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        id: branch
        shell: bash
        run: |
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          BRANCH="release/${VERSION}"
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "::warning::Branch ${BRANCH} already exists on origin. Skip creation."
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -b "${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Bump TJHana-sdk-android dependency in app/build.gradle.kts
        if: steps.branch.outputs.skip != 'true'
        shell: bash
        run: |
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          sed -i -E "s|(com\.github\.tjlabs:TJHana-sdk-android:)[0-9]+\.[0-9]+\.[0-9]+|\1${VERSION}|" app/build.gradle.kts
          grep 'com.github.tjlabs:TJHana-sdk-android' app/build.gradle.kts

      - name: Commit & push
        id: commit
        if: steps.branch.outputs.skip != 'true'
        shell: bash
        run: |
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          BRANCH="${{ steps.branch.outputs.branch }}"
          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "::warning::No changes to commit (already on ${VERSION}?)"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: bump Hana SDK to ${VERSION}"
          git push -u origin "${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Open Draft PR
        if: steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          BRANCH="${{ steps.commit.outputs.branch }}"
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump Hana SDK to ${VERSION}" \
            --body "Auto-generated by Verify And Bump Hana SDK workflow. SDK build against \`${VERSION}\` succeeded on the verify job."
